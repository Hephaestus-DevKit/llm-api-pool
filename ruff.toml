# Lint gate used locally and in CI: correctness (F, E9), comparison/indent traps (E7),
# and bugbear pitfalls (B). Style-only rules are deliberately left out.
target-version = "py310"
line-length = 120

[lint]
select = ["F", "E7", "E9", "B"]
ignore = [
    "E731",  # lambda assignments read fine in the small helpers here
]
