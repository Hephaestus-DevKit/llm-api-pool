name: Build Windows EXE

permissions:
  contents: write

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    name: build-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    # The ARM64 leg is best-effort: if the native ARM64 ecosystem regresses, the x64
    # release still ships and only the ARM64 asset is skipped.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
            asset: llm-pool-windows-x64
            requirements: requirements-lock.txt
            experimental: false
          - arch: arm64
            runner: windows-11-arm
            asset: llm-pool-windows-arm64
            # The x64-resolved lock does not apply here; see requirements-arm64.txt for
            # why uvicorn[standard] and google-genai are absent on this architecture.
            requirements: requirements-arm64.txt
            experimental: true

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}

      - name: Install dependencies
        shell: pwsh
        run: |
          # Explicit exit-code checks: in a multi-command pwsh step only the last command's
          # exit code fails the step, so a failed pip install would otherwise surface later
          # as a baffling test-import error.
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $reqs = "${{ matrix.requirements }}"
          if (-not (Test-Path $reqs)) { $reqs = "requirements.txt" }
          python -m pip install -r $reqs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install pyinstaller pytest httpx ruff
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run test suite
        shell: pwsh
        run: |
          python -m pytest

      - name: Validate Python package set
        shell: pwsh
        run: |
          python -m compileall -q llm_pool main.py
          python -m ruff check llm_pool main.py tests scripts
          python scripts/validate_web_contracts.py
          python -m pip check
          python -c "import platform, struct; print('machine=', platform.machine()); print('pointer_bits=', struct.calcsize('P') * 8)"

      - name: Install Playwright Chromium
        shell: pwsh
        run: |
          python -m playwright install chromium

      - name: Build EXE with PyInstaller
        shell: pwsh
        run: |
          pyinstaller --onedir --name llm-pool --add-data "requirements.txt;." --add-data ".env.example;." --add-data "examples;examples" --add-data "README.md;." --add-data "dashboard.html;." main.py

      - name: Smoke test frozen app
        shell: pwsh
        run: |
          $port = 19080
          $env:CHANNELS_FILE = Join-Path $env:RUNNER_TEMP "channels-${{ matrix.arch }}.json"
          $exe = Resolve-Path "dist\llm-pool\llm-pool.exe"
          $proc = Start-Process -FilePath $exe -ArgumentList @("--host", "127.0.0.1", "--port", "$port", "--no-open") -PassThru -WindowStyle Hidden
          try {
            $healthy = $false
            for ($i = 0; $i -lt 40; $i++) {
              try {
                $health = Invoke-RestMethod "http://127.0.0.1:$port/health" -TimeoutSec 2
                if ($health.status -eq "ok") {
                  $healthy = $true
                  break
                }
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $healthy) { throw "Frozen app did not become healthy." }
            $page = Invoke-WebRequest "http://127.0.0.1:$port/" -TimeoutSec 5
            if ($page.Content -notmatch "LLM Pool Console") { throw "Dashboard HTML smoke failed." }
            if ($page.Content -notmatch "__LLM_POOL_BOOTSTRAP__") { throw "Local admin token bootstrap smoke failed." }
            $match = [regex]::Match($page.Content, 'adminToken:"([^"]+)"')
            if (-not $match.Success) { throw "Could not parse generated admin token from dashboard bootstrap." }
            $token = $match.Groups[1].Value
            $diag = Invoke-RestMethod "http://127.0.0.1:$port/admin/diagnostics" -Headers @{"X-Admin-Token" = $token} -TimeoutSec 5
            if (-not $diag.runtime -or -not $diag.security -or -not $diag.events) { throw "Diagnostics smoke failed." }
            if (-not $diag.routing) { throw "Routing diagnostics smoke failed." }

            # A tool-carrying Anthropic request is what Claude Code sends on every call. With
            # no channels configured it must reach the router and answer 503, never crash.
            $toolBody = @{
              model = "claude-sonnet-5"
              max_tokens = 16
              messages = @(@{ role = "user"; content = "ping" })
              tools = @(@{
                name = "smoke_probe"
                description = "probe"
                input_schema = @{ type = "object"; properties = @{} }
              })
            } | ConvertTo-Json -Depth 8
            $toolResponse = Invoke-WebRequest "http://127.0.0.1:$port/v1/messages" -Method Post `
              -Body $toolBody -ContentType "application/json" -TimeoutSec 10 -SkipHttpErrorCheck
            if ($toolResponse.StatusCode -ne 503) {
              throw "Tool-carrying request returned $($toolResponse.StatusCode), expected 503 on an empty pool."
            }
          } finally {
            if ($proc -and -not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force
              $proc.WaitForExit()
            }
          }

      - name: Zip and checksum
        shell: pwsh
        run: |
          $asset = "${{ matrix.asset }}"
          $zip = "dist\$asset.zip"
          Compress-Archive -Path dist\llm-pool -DestinationPath $zip -Force
          $hash = Get-FileHash $zip -Algorithm SHA256
          "$($hash.Hash.ToLowerInvariant())  $asset.zip" | Set-Content -Path "$zip.sha256" -Encoding ascii

      - name: Upload to Release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" "dist/${{ matrix.asset }}.zip" "dist/${{ matrix.asset }}.zip.sha256" --clobber
